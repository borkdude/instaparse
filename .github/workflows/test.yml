name: Tests

on: [push, pull_request]

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@master
        with:
          lein: latest
      - run: lein test

  bb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@master
        with:
          # switch to bb: latest when stable bb has CharSequence reify support
          bb: latest
      - run: bash <(curl -s https://raw.githubusercontent.com/babashka/babashka/master/install) --dev-build --dir .
      - run: ./bb test:bb
